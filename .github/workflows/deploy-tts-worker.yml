name: Deploy TTS Worker

# Deploys the Azure-TTS + writing-feedback + island-translate Cloudflare Worker.
# Runs on push to main when the worker changes, or manually from the Actions tab.
# Requires these repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# AZURE_SPEECH_KEY, and (for /correct + /island/translate) ANTHROPIC_API_KEY.
# Optional (for Voikko-verified island sentences): VOIKKO_SERVICE_URL and, if the
# service requires it, VOIKKO_SHARED_SECRET. Until VOIKKO_SERVICE_URL is set,
# island sentences are saved as unverified drafts (the app says so).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'workers/tts/**'
      - '.github/workflows/deploy-tts-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/tts
          secrets: |
            AZURE_SPEECH_KEY
            ANTHROPIC_API_KEY
            VOIKKO_SERVICE_URL
            VOIKKO_SHARED_SECRET
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOIKKO_SERVICE_URL: ${{ secrets.VOIKKO_SERVICE_URL }}
          VOIKKO_SHARED_SECRET: ${{ secrets.VOIKKO_SHARED_SECRET }}
