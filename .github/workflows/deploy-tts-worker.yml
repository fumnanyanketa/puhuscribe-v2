name: Deploy TTS Worker

# Deploys the Azure-TTS + writing-feedback + island-translate Cloudflare Worker.
# Runs on push to main when the worker changes, or manually from the Actions tab.
# Requires these repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# AZURE_SPEECH_KEY, and (for /correct + /island/translate) ANTHROPIC_API_KEY.
# Optional (for Voikko-verified island sentences): VOIKKO_SERVICE_URL and, if the
# service requires it, VOIKKO_SHARED_SECRET. These are set in a separate step that
# only runs when they exist, so an unset value never breaks the deploy. Until
# VOIKKO_SERVICE_URL is set, island sentences are saved as unverified drafts.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'workers/tts/**'
      - '.github/workflows/deploy-tts-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VOIKKO_SERVICE_URL: ${{ secrets.VOIKKO_SERVICE_URL }}
      VOIKKO_SHARED_SECRET: ${{ secrets.VOIKKO_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/tts
          secrets: |
            AZURE_SPEECH_KEY
            ANTHROPIC_API_KEY
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Optional: only runs once the Voikko validation service is deployed and its
      # URL is set as a repo secret. Worker secrets persist across deploys, so this
      # doesn't need to re-run on every push.
      - name: Set Voikko service secrets
        if: ${{ env.VOIKKO_SERVICE_URL != '' }}
        working-directory: workers/tts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "$VOIKKO_SERVICE_URL" | npx --yes wrangler@3.90.0 secret put VOIKKO_SERVICE_URL
          if [ -n "$VOIKKO_SHARED_SECRET" ]; then
            echo "$VOIKKO_SHARED_SECRET" | npx --yes wrangler@3.90.0 secret put VOIKKO_SHARED_SECRET
          fi
